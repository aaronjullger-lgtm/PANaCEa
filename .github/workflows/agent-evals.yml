name: Agent Evaluations

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent-orchestrator/**'
      - '.github/workflows/agent-evals.yml'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to evaluate (blank = all)'
        required: false
        default: ''

env:
  NODE_VERSION: '22'

jobs:
  agent-eval:
    name: Run Agent Evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install orchestrator
        working-directory: packages/agent-orchestrator
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        working-directory: packages/agent-orchestrator
        run: npm run typecheck

      - name: Run agent evaluations
        working-directory: packages/agent-orchestrator
        run: |
          if [ -n "${{ github.event.inputs.dataset }}" ]; then
            npx tsx src/eval/cli.ts run "${{ github.event.inputs.dataset }}"
          else
            npx tsx src/eval/cli.ts all
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ORCHESTRATOR_CHECKPOINT: 'off'

      - name: Post eval summary
        if: always()
        run: |
          echo "## Agent Evaluation Results" >> $GITHUB_STEP_SUMMARY
          echo "Dataset: ${{ github.event.inputs.dataset || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for detailed results." >> $GITHUB_STEP_SUMMARY