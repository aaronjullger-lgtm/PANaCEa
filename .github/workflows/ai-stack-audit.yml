# purpose: Run the callGemini migration auditor on PRs that touch the AI stack.
# owner: Platform / DevEx
# trigger strategy: pull_request touching functions/api/**, lib/**, scripts/**
# secrets required: GITHUB_TOKEN (for PR comment)
# expected runtime: 1-2 minutes
# failure behavior: Advisory-only — does NOT fail the PR. Posts the migration
#   report as a comment so reviewers can see whether direct_callGemini count
#   changed. NOTE: the audit step itself (below) WILL fail the job if the
#   agent returns non-ok (script bug, scan error). That is intentional — a
#   broken auditor is not advisory.
name: AI Stack Audit (report-only)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'functions/api/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/ai-stack-audit.yml'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-stack-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  audit:
    name: callGemini migration audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run callGemini auditor
        id: audit
        run: |
          set -euo pipefail
          npm run audit:callgemini -- --max-files=8000 > audit-report.md
          npm run audit:callgemini -- --json --max-files=8000 > audit-report.json
          echo "## Summary (from JSON)"
          cat audit-report.json | jq '.summary'

      - name: Find existing comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- callgemini-audit-report -->'

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- callgemini-audit-report -->
            ## 🤖 callGemini Migration Audit

            This report was generated by the `callgemini-auditor` LangGraph agent scanning the PR's version of the codebase.

            $(cat audit-report.md)

            ---
            _Advisory only — does not block merge. Run `npm run audit:callgemini` locally for the full report._
  verify-langsmith:
    name: LangSmith tracing verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify LangSmith tracing
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run verify:langsmith
