# Deploy to Cloudflare Pages ONLY after CI passes.
# Triggers: (a) when CI workflow succeeds on main, or (b) manual dispatch.
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Project name: panacea (Workers & Pages) — matches wrangler.toml
name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy if CI succeeded (or manual dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run events, checkout the commit that triggered CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Core type check
        run: npm run typecheck:ci

      - name: Build (with Sentry source map upload)
        run: npm run build
        env:
          SENTRY_UPLOAD: 'true'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify build output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== asset count ==="
          ls dist/assets/ | wc -l
          test -f dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)

      - name: Verify Pages Functions
        run: |
          echo "=== functions/api/ structure ==="
          ls -la functions/api/ | head -20
          FUNC_COUNT=$(find functions/api -name "*.ts" | wc -l | tr -d ' ')
          echo "Functions found: $FUNC_COUNT"
          if [ "$FUNC_COUNT" -lt "5" ]; then
            echo "ERROR: Expected at least 5 function files, found $FUNC_COUNT"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=panacea --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
