# purpose: Deploy the PANaCEa Cloudflare Pages application after CI succeeds on main or on manual operator dispatch.
# owner: Platform / DevOps
# trigger strategy: workflow_run (CI success on main), workflow_dispatch
# secrets required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL, optionally SENTRY_ORG, SENTRY_PROJECT, and SENTRY_AUTH_TOKEN
# expected runtime: 10-15 minutes
# failure behavior: Stop promotion, inspect the failed build or deploy step, and redeploy only after the root cause is fixed.
name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages-main
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy if CI succeeded (or manual dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run events, checkout the commit that triggered CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Recover normalized study schema migration retry
        run: |
          set +e
          npx prisma migrate resolve --rolled-back 20260502000000_normalized_study_schema
          RESOLVE_EXIT=$?
          set -e

          if [ "$RESOLVE_EXIT" -eq 0 ]; then
            echo "Marked failed 20260502000000_normalized_study_schema migration as rolled back for retry."
          else
            echo "No failed 20260502000000_normalized_study_schema migration needed rollback resolution."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Core type check
        run: npm run typecheck:ci

      - name: Build (with Sentry source map upload)
        run: npm run build
        env:
          SENTRY_UPLOAD: 'true'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify build output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== asset count ==="
          ls dist/assets/ | wc -l
          test -f dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)

      - name: Verify Pages Functions
        run: |
          echo "=== functions/api/ structure ==="
          ls -la functions/api/ | head -20
          FUNC_COUNT=$(find functions/api -name "*.ts" | wc -l | tr -d ' ')
          echo "Functions found: $FUNC_COUNT"
          if [ "$FUNC_COUNT" -lt "5" ]; then
            echo "ERROR: Expected at least 5 function files, found $FUNC_COUNT"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=panacea --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment health
        # Belt-and-suspenders: confirm the deployed edge function responds correctly.
        # Accepts 200 (healthy) and 503 (degraded but alive) — fails on 4xx/5xx/timeout.
        # Wait 45s for Cloudflare edge propagation before polling.
        run: |
          echo "Waiting 45s for Cloudflare edge propagation..."
          sleep 45
          HTTP_STATUS=$(curl -sf -o /tmp/health.json -w "%{http_code}" \
            --max-time 30 \
            https://studypanacea.com/api/health || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          if [ -f /tmp/health.json ]; then
            cat /tmp/health.json
          fi
          if [[ "$HTTP_STATUS" == "200" || "$HTTP_STATUS" == "503" ]]; then
            echo "Health check passed (status=$HTTP_STATUS)."
          else
            echo "ERROR: Unexpected health check status $HTTP_STATUS — deployment may have failed."
            echo "See docs/ROLLBACK.md for rollback steps."
            exit 1
          fi

  # ─── Advisory Lighthouse CI ─────────────────────────────────────────────────
  # Runs after deploy against the live production URL.
  # Advisory (continue-on-error) until three consecutive green baseline runs —
  # see docs/CI-GATES.md ratchet plan step 5.
  lighthouse-ci:
    name: Lighthouse CI (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    continue-on-error: true
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Wait for Cloudflare CDN cache warm
        # Lighthouse runs 3 consecutive audits per URL (see lighthouserc.prod.js).
        # Give the edge 30s after deploy to warm before the first run.
        run: sleep 30

      - name: Run Lighthouse CI against production
        run: npx lhci autorun --config=./lighthouserc.prod.js
        env:
          LHCI_URL: https://studypanacea.com/

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
