name: StudyPANaCEa CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  # ============================================================================
  # 1. CODE QUALITY CHECKS
  # ============================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Check for console.log statements
        run: |
          if grep -r "console.log" src/ components/ lib/ --exclude-dir=node_modules; then
            echo "❌ Found console.log statements in code"
            exit 1
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for debug statements
        run: |
          if grep -r "debugger" src/ components/ lib/ --exclude-dir=node_modules; then
            echo "❌ Found debugger statements in code"
            exit 1
          else
            echo "✅ No debugger statements found"
          fi

  # ============================================================================
  # 2. UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v3
        with:
          name: test-coverage
          path: coverage/

  # ============================================================================
  # 3. BUILD AND BUNDLE ANALYSIS
  # ============================================================================
  build-analysis:
    name: Build and Bundle Analysis
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Analyze bundle size
        run: |
          echo "📊 Bundle Analysis Report"
          echo "========================"

          # Get main bundle size
          MAIN_BUNDLE=$(find dist/assets -name "*.js" | head -1)
          if [ -f "$MAIN_BUNDLE" ]; then
            MAIN_SIZE=$(stat -f "%z" "$MAIN_BUNDLE" 2>/dev/null || stat -c "%s" "$MAIN_BUNDLE")
            MAIN_SIZE_KB=$(echo "scale=2; $MAIN_SIZE / 1024" | bc)
            echo "Main bundle: $MAIN_SIZE_KB KB"
          fi

          # Get total assets size
          TOTAL_SIZE=$(find dist/assets -type f -exec stat -f "%z" {} + 2>/dev/null | awk '{sum+=$1} END {print sum}')
          TOTAL_SIZE_KB=$(echo "scale=2; $TOTAL_SIZE / 1024" | bc)
          echo "Total assets: $TOTAL_SIZE_KB KB"

          # Check if bundle exceeds threshold
          if (( $(echo "$MAIN_SIZE_KB > 500" | bc -l) )); then
            echo "⚠️  Main bundle exceeds 500KB threshold"
          else
            echo "✅ Main bundle within acceptable size"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: dist/

  # ============================================================================
  # 4. E2E TESTS (PLAYWRIGHT)
  # ============================================================================
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build-analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build for E2E tests
        run: npm run build

      - name: Start server for E2E tests
        run: npm run dev:server &
        env:
          NODE_ENV: test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/

  # ============================================================================
  # 4b. E2E TESTS AGAINST WRANGLER (Production parity - Cloudflare Pages Functions)
  # ============================================================================
  e2e-wrangler:
    name: E2E (Wrangler/CF Pages)
    runs-on: ubuntu-latest
    needs: build-analysis
    # Optional: configure GEMINI_API_KEY, DATABASE_URL, CLERK_SECRET_KEY secrets for this to pass
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build for E2E tests
        run: npm run build

      - name: Start Wrangler Pages dev server
        run: |
          npx wrangler pages dev dist \
            --port 3000 \
            --compatibility-date=2024-01-01 \
            -b "GEMINI_API_KEY=$GEMINI_API_KEY" \
            -b "DATABASE_URL=$DATABASE_URL" \
            -b "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" &
          echo "Waiting for Wrangler to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Wrangler ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Wrangler failed to start in time"
              exit 1
            fi
            sleep 2
          done
        env:
          NODE_ENV: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Run E2E tests against Wrangler
        run: npm run test:e2e:wrangler
        env:
          NODE_ENV: test
          CI: true

      - name: Upload Playwright report (Wrangler)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-wrangler
          path: playwright-report/

  # ============================================================================
  # 5. SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [e2e-tests, e2e-wrangler]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --production

      - name: Check for security vulnerabilities
        run: |
          echo "🔒 Security Audit Report"
          echo "======================"

          # Check for known vulnerabilities
          VULNERABILITIES=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.total // 0' 2>/dev/null || echo "0")

          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "⚠️  Found $VULNERABILITIES vulnerabilities"
            npm audit
            exit 1
          else
            echo "✅ No known security vulnerabilities"
          fi

      - name: Run security checks
        run: |
          # Curated blocklist: fail only on patterns that look like hardcoded secrets
          # (excludes env var references like CLERK_SECRET_KEY, process.env.X)
          echo "🔒 Scanning for hardcoded secrets..."
          MATCHES=$(grep -rE --include="*.ts" --include="*.tsx" --include="*.js" \
            -e 'sk_live_[a-zA-Z0-9]{24}' \
            -e 'sk_test_[a-zA-Z0-9]{24}' \
            --exclude-dir=node_modules --exclude-dir=dist \
            --exclude="*.md" . 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Potential hardcoded secrets detected. Use environment variables instead."
            echo "$MATCHES" | head -10
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  # ============================================================================
  # 6. DEPLOYMENT PREPARATION
  # ============================================================================
  deployment-prep:
    name: Deployment Preparation
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (with Sentry source maps if configured)
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Vite Sentry plugin uploads only when all of the above are set
          SENTRY_UPLOAD: 'true'

      - name: Run database migrations check
        run: npm run db:generate

      - name: Verify Prisma client
        run: npm run db:generate

      - name: Create deployment artifacts
        run: |
          mkdir -p deployment
          cp -r dist/ deployment/
          cp package.json deployment/
          cp prisma/ deployment/prisma/ -r
          echo "node_modules" > deployment/.gitignore

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: deployment/

  # ============================================================================
  # 7. DEPLOYMENT (PRODUCTION)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deployment-prep
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifacts
        uses: actions/download-artifact@v3
        with:
          name: deployment-package
          path: deployment

      - name: Set up Cloudflare Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          cd deployment
          echo "🚀 Deploying to Cloudflare Pages..."
          wrangler pages deploy dist/ --project-name=panceai --branch=main

      - name: Run post-deployment health check
        run: |
          echo "✅ Deployment completed successfully"
          echo "📊 Verifying deployment via health endpoint..."

          # Health check with retries (deployment may take a few seconds to propagate)
          HEALTH_URL="https://studypanacea.com/api/health"
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5: Checking $HEALTH_URL"
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 15 "$HEALTH_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(jq -r '.status' /tmp/health.json 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Health check passed - deployment verified (status: $STATUS)"
                exit 0
              fi
            fi
            echo "  Response: HTTP $HTTP_CODE"
            sleep 5
          done

          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          custom_payload: |
            {
              attachments: [{
                color: 'good',
                title: '🚀 Production Deployment Successful',
                text: 'StudyPANaCEa has been deployed to production',
                fields: [{
                  title: 'Commit',
                  value: '${{ github.sha }}',
                  short: true
                }, {
                  title: 'Branch',
                  value: '${{ github.ref }}',
                  short: true
                }, {
                  title: 'Environment',
                  value: 'Production',
                  short: true
                }],
                footer: 'Deployed via GitHub Actions',
                ts: Math.floor(new Date().getTime() / 1000)
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================================
  # 8. PERFORMANCE MONITORING
  # ============================================================================
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Smoke test and Lighthouse
        run: |
          echo "Starting local server..."
          npx serve dist -l 3000 &
          echo "Waiting for server..."
          for i in $(seq 1 15); do
            if curl -sf --max-time 3 http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "❌ Server failed to start"
              exit 1
            fi
            sleep 2
          done
          echo "Running smoke test..."
          if curl -sf --max-time 10 http://localhost:3000 | grep -q "html"; then
            echo "✅ Smoke test passed - app serves successfully"
          else
            echo "❌ Smoke test failed - app did not return expected content"
            exit 1
          fi
          echo "Running Lighthouse CI..."
          npx @lhci/cli@0.15 autorun 2>/dev/null || echo "Lighthouse audit skipped (optional)"
          mkdir -p lighthouse-reports
          cp -r .lighthouseci/* lighthouse-reports/ 2>/dev/null || true

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: lighthouse-reports/
          if-no-files-found: ignore

  # ============================================================================
  # 9. ROLLBACK CAPABILITY
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloudflare Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Rollback to previous deployment
        run: |
          echo "🔙 Rolling back to previous deployment..."
          echo "📋 Listing recent deployments..."
          npx wrangler pages deployment list --project-name=panceai
          echo ""
          echo "📖 To complete rollback: Go to Cloudflare Dashboard → Workers & Pages → panceai → Deployments"
          echo "   Click ⋯ on the desired deployment → 'Rollback to this deployment'"
          echo "   See docs/deployment/ROLLBACK.md for full instructions."

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          custom_payload: |
            {
              attachments: [{
                color: 'warning',
                title: '🔙 Deployment Rollback',
                text: 'StudyPANaCEa has been rolled back to previous version',
                fields: [{
                  title: 'Triggered by',
                  value: '${{ github.actor }}',
                  short: true
                }, {
                  title: 'Environment',
                  value: 'Production',
                  short: true
                }],
                footer: 'Rollback completed',
                ts: Math.floor(new Date().getTime() / 1000)
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# ============================================================================
# WORKFLOW SUMMARY
# ============================================================================
# This CI/CD pipeline includes:
#
# 1. Code Quality Checks - TypeScript, ESLint, Prettier
# 2. Unit Tests - Vitest with coverage
# 3. Build Analysis - Bundle size optimization
# 4. E2E Tests - Playwright testing
# 5. Security Audit - Vulnerability scanning
# 6. Deployment Prep - Build and package
# 7. Production Deploy - Cloudflare Pages
# 8. Performance Monitoring - Lighthouse CI
# 9. Rollback Capability - Safety net
#
# Total Jobs: 9
# Estimated Duration: ~15 minutes
# ============================================================================
