# Weekly Automation Tasks
# Runs comprehensive system audits and user reports every Sunday at 2 AM EST

name: Weekly Automation

on:
  schedule:
    # Run every Sunday at 2 AM EST (7 AM UTC)
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      skip_reports:
        description: 'Skip generating user reports'
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

jobs:
  weekly-tasks:
    name: Run Weekly Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run weekly health checks
        id: health-checks
        run: |
          npx tsx scripts/automation/jobs/healthChecks.ts --daily 2>&1 | tee health-output.txt
          echo "health_status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run weekly user statistics
        id: user-stats
        if: ${{ github.event.inputs.skip_reports != 'true' }}
        run: |
          npx tsx -e "
            import { generateWeeklyProgressReports, calculateWeeklyRetention, updatePANCEReadinessEstimates, disconnect } from './scripts/automation/jobs/userStatistics';
            
            async function main() {
              console.log('📊 Running weekly user statistics...');
              
              try {
                const reports = await generateWeeklyProgressReports();
                console.log('Reports:', JSON.stringify(reports, null, 2));
                
                const retention = await calculateWeeklyRetention();
                console.log('Retention:', JSON.stringify(retention, null, 2));
                
                const readiness = await updatePANCEReadinessEstimates();
                console.log('Readiness updates:', readiness);
                
                console.log('✅ Weekly statistics complete');
              } catch (error) {
                console.error('❌ Weekly statistics failed:', error);
                process.exit(1);
              } finally {
                await disconnect();
              }
            }
            
            main();
          "
        continue-on-error: true

      - name: Run weekly tasks script
        run: npm run automation:weekly 2>&1 | tee weekly-output.txt
        continue-on-error: true

      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: |
            logs/weekly/
            weekly-report-latest.txt
            health-output.txt
            weekly-output.txt
          retention-days: 30

      - name: Check for failures
        run: |
          if grep -q "FAIL\|ERROR\|failed" health-output.txt weekly-output.txt 2>/dev/null; then
            echo "⚠️ Some tasks reported issues"
            exit 0  # Don't fail the workflow, but note the issues
          fi
          echo "✅ All weekly tasks completed"

  database-optimization:
    name: Database Optimization
    runs-on: ubuntu-latest
    needs: weekly-tasks
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database cleanup
        run: |
          npx tsx -e "
            import { PrismaClient } from '@prisma/client';
            const prisma = new PrismaClient();
            
            async function cleanup() {
              console.log('🧹 Running database cleanup...');
              
              const thirtyDaysAgo = new Date();
              thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
              
              // Clean old background jobs
              const deletedJobs = await prisma.backgroundJob.deleteMany({
                where: {
                  status: { in: ['completed', 'failed'] },
                  completedAt: { lt: thirtyDaysAgo },
                },
              });
              console.log('Deleted', deletedJobs.count, 'old background jobs');
              
              // Clean old sync queue items
              const deletedSync = await prisma.syncQueue.deleteMany({
                where: {
                  status: 'completed',
                  syncedAt: { lt: thirtyDaysAgo },
                },
              });
              console.log('Deleted', deletedSync.count, 'old sync queue items');
              
              await prisma.\$disconnect();
              console.log('✅ Database cleanup complete');
            }
            
            cleanup().catch(console.error);
          "

  notify-complete:
    name: Send Completion Notification
    runs-on: ubuntu-latest
    needs: [weekly-tasks, database-optimization]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Weekly Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Weekly Tasks: ${{ needs.weekly-tasks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Database Optimization: ${{ needs.database-optimization.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Weekly reports are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY
