# purpose: Produce the weekly read-heavy operator report, separate from backup, cleanup, and AI-driven maintenance.
# owner: Analytics / Learning Platform
# trigger strategy: schedule + workflow_dispatch; keep reporting isolated so reruns are safe and artifacts stay legible.
# secrets required: DATABASE_URL, PRODUCTION_URL, and CRON_SECRET.
# expected runtime: 20-35 minutes depending on DB size and progress-audit CSV generation.
# failure behavior: Fail the lane, inspect the weekly report artifacts and HTTP logs, and rerun manually only after confirming report-only scope.

name: Sched - Weekly Platform Report

on:
  schedule:
    - cron: "18 6 * * 0"
  workflow_dispatch:
    inputs:
      target_scope:
        description: Manual scope. Use report-only for the safest rerun; full-lane also enables the psychometric snapshot endpoint.
        required: false
        default: report-only
        type: choice
        options:
          - report-only
          - full-lane
      skip_expensive_steps:
        description: Skip CSV exports during manual review to keep the report lighter.
        required: false
        default: false
        type: boolean
      report_only:
        description: Keep the manual run read-heavy and skip the psychometric snapshot endpoint.
        required: false
        default: true
        type: boolean
      environment_guard:
        description: Required before a manual run is allowed to execute the psychometric snapshot endpoint.
        required: false
        default: report-only
        type: choice
        options:
          - report-only
          - allow-psychometric-snapshot

permissions:
  contents: read

concurrency:
  group: sched-weekly-platform-report
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: read
    uses: ./.github/workflows/_automation-lane.yml
    secrets: inherit
    with:
      lane_name: Weekly Platform Report
      lane_slug: weekly-platform-report
      shell_commands: |
        set -euo pipefail

        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.report_only }}" != "true" ] && [ "${{ inputs.environment_guard }}" != "allow-psychometric-snapshot" ]; then
          echo "Manual psychometric snapshot calls require environment_guard=allow-psychometric-snapshot." >&2
          exit 1
        fi

        {
          echo "### Weekly Platform Report Mode"
          echo ""
          echo "- Target scope: ${{ github.event_name == 'workflow_dispatch' && inputs.target_scope || 'full-lane' }}"
          echo "- Report only: ${{ github.event_name != 'workflow_dispatch' || inputs.report_only }}"
          echo "- Skip expensive steps: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_expensive_steps || false }}"
        } >> "${GITHUB_STEP_SUMMARY}"

        args=()
        if [ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_expensive_steps || false }}" = "true" ]; then
          args+=(--skip-progress-csv)
        fi
        npm run automation:weekly:report -- "${args[@]}"
      run_cron_endpoints: ${{ github.event_name != 'workflow_dispatch' || (inputs.target_scope == 'full-lane' && !inputs.report_only) }}
      cron_endpoints: |
        POST|/api/cron/compute-item-metrics|{}
      artifact_path: |
        logs/weekly-platform-report/*.json
        logs/weekly-platform-report/*.md
        logs/weekly-platform-report/*.csv
        logs/automation-http/*.log
      artifact_retention_days: 21
      timeout_minutes: 35
      node_version: "22"
