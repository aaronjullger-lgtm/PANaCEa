# purpose: Trigger Cursor Cloud Agents on code changes or manual operator dispatch without any scheduled execution path.
# owner: Platform / DevEx
# trigger strategy: pull_request, push, workflow_dispatch (intentionally no schedule)
# secrets required: CURSOR_AGENTS_API_KEY
# expected runtime: 5-20 minutes per agent job
# failure behavior: Review the failed job log, then rerun the specific agent manually if the path-based trigger still applies. Do not restore recurring cron execution for cloud agents.

name: Cloud Agents

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      agent_job:
        description: "Manual agent job"
        required: true
        default: "pr-review"
        type: choice
        options:
          - pr-review
          - edge-guard
          - living-docs
          - asset-perf
          - schema-sync
          - e2e-gap
          - security-sentinel
          - lint-fix
      target_branch:
        description: "Repo branch/ref for the agent to inspect (security-sentinel must use main)"
        required: false
        default: "main"
        type: string
      changed_files_override:
        description: "Optional changed-files context for manual non-security runs (comma or newline separated)"
        required: false
        default: ""
        type: string
      package_name:
        description: "Required for security-sentinel: vulnerable package name"
        required: false
        default: ""
        type: string
      package_version:
        description: "Optional for security-sentinel: target safe version"
        required: false
        default: ""
        type: string
      advisory_url:
        description: "Optional for security-sentinel: advisory or Dependabot URL"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-agents-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  # Determine which path sets changed (for PR/push).
  path-filter:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      functions_api: ${{ steps.filter.outputs.functions_api }}
      assets: ${{ steps.filter.outputs.assets }}
      schema_config: ${{ steps.filter.outputs.schema_config }}
      e2e_scope: ${{ steps.filter.outputs.e2e_scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            functions_api:
              - 'functions/api/**'
              - 'lib/prisma.ts'
              - 'functions/api/_shared/**'
            assets:
              - 'public/**'
              - '**/*.css'
              - 'App.tsx'
              - 'components/**'
            schema_config:
              - 'prisma/schema.prisma'
              - 'scripts/db/**'
              - 'scripts/automation/**'
              - 'config/conditionRegistry.ts'
              - 'config/training-modes.ts'
            e2e_scope:
              - 'components/modes/**'
              - 'components/session/**'
              - 'functions/api/**'

  # Get changed files list (for agent instructions).
  changed-files:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    outputs:
      list: ${{ steps.files.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List changed files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LIST=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} 2>/dev/null || true)
          else
            LIST=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- . 2>/dev/null || true)
          fi
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ---------- Agent: Edge / Prisma compliance (functions/**)
  agent-edge-guard:
    name: Agent – Edge/Prisma Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [path-filter, changed-files]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.path-filter.outputs.functions == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Launch Edge/Prisma compliance agent
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: edge-guard
          CHANGED_FILES: ${{ needs.changed-files.outputs.list }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts

  # ---------- Agent: Living documentation (functions/api/**)
  agent-living-docs:
    name: Agent – Living Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [path-filter, changed-files]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.path-filter.outputs.functions_api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Launch Living Docs agent
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: living-docs
          CHANGED_FILES: ${{ needs.changed-files.outputs.list }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts

  # ---------- Agent: Asset & performance (public, css, components)
  agent-asset-perf:
    name: Agent – Asset/Perf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [path-filter, changed-files]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.path-filter.outputs.assets == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Launch Asset/Perf agent
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: asset-perf
          CHANGED_FILES: ${{ needs.changed-files.outputs.list }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts

  # ---------- Agent: Content & schema sync
  agent-schema-sync:
    name: Agent – Schema Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [path-filter, changed-files]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.path-filter.outputs.schema_config == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Launch Schema Sync agent
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: schema-sync
          CHANGED_FILES: ${{ needs.changed-files.outputs.list }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts

  # ---------- Agent: E2E / test gap filler
  agent-e2e-gap:
    name: Agent – E2E Gap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [path-filter, changed-files]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.path-filter.outputs.e2e_scope == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Launch E2E Gap agent
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: e2e-gap
          CHANGED_FILES: ${{ needs.changed-files.outputs.list }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts

  # ---------- Agent: PR review (on any PR)
  agent-pr-review:
    name: Agent – PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changed-files]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Launch PR Review agent
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: pr-review
          CHANGED_FILES: ${{ needs.changed-files.outputs.list }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts

  # ---------- Manual dispatch: operator-triggered jobs only. No scheduled cloud-agent lane.
  agent-manual:
    name: Agent – Manual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.agent_job != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Validate manual dispatch inputs
        run: |
          set -euo pipefail

          job="${{ github.event.inputs.agent_job }}"
          branch="${{ github.event.inputs.target_branch }}"
          package_name="${{ github.event.inputs.package_name }}"
          package_version="${{ github.event.inputs.package_version }}"
          advisory_url="${{ github.event.inputs.advisory_url }}"

          if [ "${job}" = "security-sentinel" ]; then
            if [ -z "${package_name}" ]; then
              echo "security-sentinel requires package_name." >&2
              exit 1
            fi

            if [ -z "${package_version}" ] && [ -z "${advisory_url}" ]; then
              echo "security-sentinel requires package_version or advisory_url." >&2
              exit 1
            fi

            if [ "${branch}" != "main" ]; then
              echo "security-sentinel must target main so the agent branches from the primary release line." >&2
              exit 1
            fi
          fi

          {
            echo "### Manual Cloud-Agent Dispatch"
            echo ""
            echo "- Agent job: ${job}"
            echo "- Target branch: ${branch}"
            echo "- Scheduled execution: disallowed"
            echo "- Trigger mode: workflow_dispatch"
            if [ "${job}" = "security-sentinel" ]; then
              echo "- Package name: ${package_name}"
              echo "- Package version: ${package_version:-n/a}"
              echo "- Advisory URL: ${advisory_url:-n/a}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Build manual context
        id: changed
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.changed_files_override }}" ]; then
            LIST="${{ github.event.inputs.changed_files_override }}"
          else
            LIST=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ".")
          fi
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Launch agent (${{ github.event.inputs.agent_job }})
        env:
          CURSOR_AGENTS_API_KEY: ${{ secrets.CURSOR_AGENTS_API_KEY }}
          AGENT_JOB: ${{ github.event.inputs.agent_job }}
          CHANGED_FILES: ${{ steps.changed.outputs.list }}
          AGENT_BRANCH_OVERRIDE: ${{ github.event.inputs.target_branch }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
          ADVISORY_URL: ${{ github.event.inputs.advisory_url }}
        run: npx tsx scripts/cloud-agents/run-from-ci.ts
