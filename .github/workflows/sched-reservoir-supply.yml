# purpose: Keep live reservoir supply above minimum levels until this responsibility moves into app-native queue ownership.
# owner: Learning Platform / Reservoir
# trigger strategy: schedule + workflow_dispatch; transitional two-hour lane retained only until runtime-owned reservoir maintenance exists.
# secrets required: PRODUCTION_URL, CRON_SECRET
# expected runtime: 5-10 minutes
# failure behavior: Fail on HTTP endpoint errors, upload reservoir HTTP logs, and rerun manually only after confirming live supply pressure and explicitly opting into mutation.

name: Sched - Reservoir Supply

on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:
    inputs:
      target_scope:
        description: Manual scope. Report-only is the safe default; choose the smallest live endpoint set that matches the real reservoir problem.
        required: false
        default: report-only
        type: choice
        options:
          - report-only
          - maintenance-only
          - refill-only
          - full-lane
      report_only:
        description: Skip live reservoir endpoint calls and produce only operator guidance in the run summary.
        required: false
        default: true
        type: boolean
      environment_guard:
        description: Required before a manual run is allowed to mutate live reservoir state.
        required: false
        default: report-only
        type: choice
        options:
          - report-only
          - allow-live-reservoir-mutation

permissions:
  contents: read

concurrency:
  group: sched-reservoir-supply
  cancel-in-progress: false

jobs:
  run:
    name: Reservoir Supply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Validate manual dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          case "${{ inputs.target_scope }}" in
            report-only|maintenance-only|refill-only|full-lane) ;;
            *)
              echo "Unknown target_scope for reservoir supply." >&2
              exit 1
              ;;
          esac

          if [ "${{ inputs.report_only }}" != "true" ] && [ "${{ inputs.environment_guard }}" != "allow-live-reservoir-mutation" ]; then
            echo "Manual live reservoir runs require environment_guard=allow-live-reservoir-mutation." >&2
            exit 1
          fi

      - name: Run reservoir endpoint fanout
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.report_only }}
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PRODUCTION_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "PRODUCTION_URL and CRON_SECRET are required for live reservoir runs." >&2
              exit 1
            fi
            echo "PRODUCTION_URL and/or CRON_SECRET not configured; skipping live reservoir fanout."
            {
              echo "### Reservoir Supply Skipped (report-only)"
              echo ""
              echo "- PRODUCTION_URL or CRON_SECRET not configured in repository secrets."
              echo "- Scheduled lane degraded to report-only; configure secrets to re-enable live fanout."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          mkdir -p logs/automation-http
          stamp=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          log_file="logs/automation-http/reservoir-supply-${stamp}.log"
          body_file=$(mktemp)
          failures=0
          endpoints_run=0

          run_endpoint() {
            local method="$1"
            local endpoint="$2"
            local payload="$3"

            endpoints_run=$((endpoints_run + 1))

            echo "[${method}] ${endpoint}" | tee -a "${log_file}"

            local status
            status=$(curl -sS -o "${body_file}" -w "%{http_code}" \
              -X "${method}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data "${payload}" \
              "${PRODUCTION_URL}${endpoint}")

            echo "status=${status}" | tee -a "${log_file}"
            cat "${body_file}" | tee -a "${log_file}"
            echo "" | tee -a "${log_file}"

            if [[ ! "${status}" =~ ^2 ]]; then
              failures=$((failures + 1))
              echo "::error title=Reservoir endpoint failed::${method} ${endpoint} returned HTTP ${status}"
            fi
          }

          scope="${{ github.event_name == 'workflow_dispatch' && inputs.target_scope || 'full-lane' }}"

          case "${scope}" in
            maintenance-only)
              run_endpoint POST /api/cron/reservoir-maintenance '{}'
              ;;
            refill-only)
              run_endpoint POST /api/cron/replenish-pool '{}'
              ;;
            full-lane)
              run_endpoint POST /api/cron/reservoir-maintenance '{}'
              run_endpoint POST /api/cron/replenish-pool '{}'
              ;;
            *)
              echo "Unexpected target_scope ${scope} for live reservoir run." >&2
              exit 1
              ;;
          esac

          {
            echo "### Reservoir Supply Endpoint Fanout"
            echo ""
            echo "- Target scope: ${scope}"
            echo "- Endpoints attempted: ${endpoints_run}"
            echo "- Failures: ${failures}"
            echo "- HTTP log: ${log_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failures}" -gt 0 ]; then
            exit 1
          fi

      - name: Upload reservoir artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sched-reservoir-supply-${{ github.run_number }}
          path: |
            logs/automation-http/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo "### Workflow Summary"
            echo ""
            echo "- Workflow: sched-reservoir-supply.yml"
            echo "- Target scope: ${{ github.event_name == 'workflow_dispatch' && inputs.target_scope || 'full-lane' }}"
            echo "- Report only: ${{ github.event_name != 'workflow_dispatch' || inputs.report_only }}"
            echo "- Artifact directory: logs/automation-http/"
            echo "- Artifact retention: 14 days"
            echo "- Next action on failure: inspect the reservoir HTTP log and confirm live supply pressure before any rerun."
          } >> "${GITHUB_STEP_SUMMARY}"
