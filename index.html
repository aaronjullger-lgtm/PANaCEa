<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/panacea-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANaCEa Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
      /* CSS Custom Properties for theming - Modern Medical Glassmorphism */
      :root {
        /* Fresh, modern light mode with soft blue-gray tones */
        --color-bg-primary: #f8fafc;
        --color-bg-secondary: #f1f5f9;
        --color-bg-tertiary: #ffffff;
        --color-text-primary: #0f172a;
        --color-text-secondary: #475569;
        --color-text-muted: #64748b;
        --color-border: #e2e8f0;
        --color-border-light: #f1f5f9;
        --color-accent: #1e40af;
        --color-accent-hover: #1e3a8a;
        --color-accent-light: #dbeafe;
        --color-card-bg: #ffffff;
        --color-input-bg: #ffffff;
        --color-overlay: rgba(15, 23, 42, 0.5);
        /* Button text colors */
        --color-btn-primary-text: #ffffff;
        --color-btn-secondary-text: #1e40af;
        /* Glass-like button effects for light mode - "Dark Stained Glass" (semi-transparent dark blue/black) */
        --color-glass-bg: rgba(15, 23, 42, 0.80);
        --color-glass-border: rgba(15, 23, 42, 0.3);
        --color-glass-shadow: rgba(0, 0, 0, 0.15);
        --color-glass-hover: rgba(15, 23, 42, 0.90);
        --color-glass-text: #f8fafc;
      }

      .dark {
        --color-bg-primary: #0f172a;
        --color-bg-secondary: #1e293b;
        --color-bg-tertiary: #334155;
        --color-text-primary: #f1f5f9;
        --color-text-secondary: #cbd5e1;
        --color-text-muted: #94a3b8;
        --color-border: #475569;
        --color-border-light: #334155;
        /* Changed from Teal to Frosted White for high contrast */
        --color-accent: rgba(248, 250, 252, 0.9);
        --color-accent-hover: rgba(255, 255, 255, 1);
        --color-accent-light: rgba(248, 250, 252, 0.15);
        --color-card-bg: #1e293b;
        --color-input-bg: #334155;
        --color-overlay: rgba(0, 0, 0, 0.7);
        /* Button text colors - dark text on light frosted backgrounds */
        --color-btn-primary-text: #0f172a;
        --color-btn-secondary-text: #f1f5f9;
        /* Mini-Dashboard tiles - force light text for readability */
        --color-tile-text: #f3f4f6;
        /* Glass-like button effects for dark mode - "Frosted White" (semi-transparent white) */
        --color-glass-bg: rgba(255, 255, 255, 0.10);
        --color-glass-border: rgba(255, 255, 255, 0.15);
        --color-glass-shadow: rgba(0, 0, 0, 0.3);
        --color-glass-hover: rgba(255, 255, 255, 0.18);
        --color-glass-text: #f1f5f9;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg-primary);
        color: var(--color-text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      #question-container {
        white-space: pre-wrap !important;
      }
      /* Table styles for vitals and labs */
      #question-container table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        margin-bottom: 1rem;
        font-size: 0.9em;
        line-height: 1.5;
      }
      #question-container th, 
      #question-container td {
        border: 1px solid var(--color-border);
        padding: 0.5rem 0.75rem;
        text-align: left;
        vertical-align: top;
      }
      #question-container th {
        background-color: var(--color-bg-secondary);
        font-weight: 600;
        color: var(--color-text-primary);
      }
      #question-container tbody tr:nth-child(even) {
        background-color: var(--color-bg-secondary);
      }
      @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
      }
      .animate-shake {
        animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes bounce {
        0%, 100% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
      .animate-bounce-custom {
        animation: bounce 1s infinite;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
      @keyframes fade-in-down {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.4s ease-out forwards;
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up 0.4s ease-out forwards;
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scale-in 0.3s ease-out forwards;
      }
      .user-highlight {
        background-color: #FFF176;
        color: #000;
      }
      .dark .user-highlight {
        background-color: #fbbf24;
        color: #000;
      }
      .feedback-content b {
        font-weight: 600;
        color: var(--color-text-primary);
      }
      .feedback-content i {
        font-style: italic;
      }

      /* Smooth transitions for interactive elements */
      button, a, input, textarea, select {
        transition: all 0.2s ease;
      }

      /* Card hover effects */
      .card-hover {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      .dark .card-hover:hover {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      }

      /* Glass button styling - Modern Medical Glassmorphism */
      .btn-glass {
        background: var(--color-glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--color-glass-border);
        color: var(--color-glass-text);
        box-shadow: 
          0 4px 16px var(--color-glass-shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        transition: all 0.2s ease;
      }
      .btn-glass:hover {
        background: var(--color-glass-hover);
        transform: translateY(-1px);
        box-shadow: 
          0 6px 20px var(--color-glass-shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
      .btn-glass:active {
        transform: translateY(0);
      }

      /* Glass card styling */
      .card-glass {
        background: var(--color-glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--color-glass-border);
        color: var(--color-glass-text);
        box-shadow: 0 4px 24px var(--color-glass-shadow);
      }

      /* Mobile Keyboard Fix - Ensure inputs remain visible when keyboard is open */
      @media (max-width: 768px) {
        input:focus,
        textarea:focus,
        select:focus {
          scroll-margin-bottom: 200px;
        }
        
        /* Extra padding for scrollable containers to help with keyboard visibility */
        .condition-scrollable {
          padding-bottom: 100px;
        }
      }
      
      /* Ensure proper viewport behavior on iOS */
      @supports (-webkit-touch-callout: none) {
        html {
          height: -webkit-fill-available;
        }
        body {
          min-height: -webkit-fill-available;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
