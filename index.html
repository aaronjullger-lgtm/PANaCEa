<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Safety net for CJS/ESM mixed module initialization -->
    <script>
      var global = global || window;
      var exports = exports || {};
    </script>
    <link rel="icon" type="image/svg+xml" href="/Favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANaCEa</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="PANCE preparation platform with comprehensive medical database, performance tracking, clinical image training, and 15+ training modes for PA students."
    />
    <meta
      name="keywords"
      content="PANCE, Physician Assistant, PA exam, medical education, NCCPA, exam preparation, spaced repetition, clinical training"
    />
    <meta name="author" content="PANaCEa" />
    <meta name="theme-color" content="#1F283A" id="meta-theme-color" />

    <!-- Apply theme before first paint to prevent FOUC and match saved/system preference -->
    <script>
      (function () {
        var stored = localStorage.getItem('pance-ai-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        else root.classList.remove('dark');
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', dark ? '#101729' : '#e9ecf1');
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studypanacea.com/" />
    <meta property="og:title" content="PANaCEa" />
    <meta
      property="og:description"
      content="Study platform with comprehensive medical database, performance tracking, clinical training modes, and 1000+ conditions for PA students."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://studypanacea.com/" />
    <meta name="twitter:title" content="PANaCEa" />
    <meta
      name="twitter:description"
      content="Study platform with comprehensive medical database, performance tracking, clinical training modes, and 1000+ conditions for PA students."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PANaCEa" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to font CDNs and Clerk auth CDN to reduce RTT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://clerk.com" />
    <link rel="preconnect" href="https://clerk.com" crossorigin />
    <link rel="dns-prefetch" href="https://img.clerk.com" />

    <!-- Favicon.svg is already loaded via rel="icon" above; no preload needed -->

    <!--
      Google Fonts: load asynchronously via JS-inserted <link> to eliminate
      render-blocking without an inline event handler (which fires a
      CSP-Report-Only violation when sha256 hashes are present in script-src).
      Dynamically-inserted stylesheet <link>s are non-blocking in all modern
      browsers. The <noscript> fallback handles JS-disabled environments.
    -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@700&family=Teko:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Guard CommonJS globals before any modulepreload/import execution.
      if (typeof globalThis.exports === 'undefined') {
        globalThis.exports = {};
      }
      if (typeof globalThis.module === 'undefined') {
        globalThis.module = { exports: globalThis.exports };
      }
      // Load Google Fonts without a render-blocking <link> or an inline
      // event handler (inline handlers trigger CSP-Report-Only violations
      // when sha256 hashes are present in script-src, because hashes
      // suppress unsafe-inline per the CSP Level 3 spec).
      // Dynamically-inserted <link rel="stylesheet"> elements are
      // non-blocking in all modern browsers — identical perf benefit.
      (function () {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href =
          'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800' +
          '&family=JetBrains+Mono:wght@400;500;600;700' +
          '&family=Poppins:wght@700&family=Teko:wght@400;500;600;700&display=swap';
        document.head.appendChild(l);
      })();
    </script>
    <style>
      /* Critical inline CSS — available before index.css loads.
         Prevents FOUC when Cloudflare CSS optimizer delays stylesheet delivery.
         Must stay in sync with index.css color tokens + Tailwind preflight resets. */
      :root {
        --header-height: 4rem;
        --nav-rail-width: 56px;
        /* Light mode color tokens (critical subset) */
        --color-bg-primary: #f8fafc;
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #f1f5f9;
        --color-text-primary: #0f172a;
        --color-text-secondary: #475569;
        --color-text-muted: #64748b;
        --color-border: #e2e8f0;
        --color-border-light: #f1f5f9;
        --color-accent: #9a8f72;
        --color-accent-hover: #8a7f62;
        --color-accent-light: #f5f2ec;
        --color-card-bg: #ffffff;
        --color-text-inverse: #f8fafc;
        --color-btn-primary-text: #f8fafc;
        --color-overlay: rgba(15, 23, 42, 0.5);
        --color-glass-bg: rgba(255, 255, 255, 0.88);
        --color-glass-border: rgba(203, 213, 225, 0.7);
        --color-shadow-soft: rgba(15, 23, 42, 0.12);
      }
      .dark {
        --color-bg-primary: #0f172a;
        --color-bg-secondary: #1e293b;
        --color-bg-tertiary: #334155;
        --color-text-primary: #f1f5f9;
        --color-text-secondary: #cbd5e1;
        --color-text-muted: #94a3b8;
        --color-border: #475569;
        --color-border-light: #334155;
        --color-accent: #a89b7a;
        --color-accent-hover: #b8ab8a;
        --color-accent-light: rgba(30, 41, 59, 0.8);
        --color-card-bg: #1e293b;
        --color-text-inverse: #0f172a;
        --color-btn-primary-text: #f8fafc;
        --color-overlay: rgba(0, 0, 0, 0.6);
        --color-glass-bg: rgba(17, 24, 39, 0.6);
        --color-glass-border: rgba(255, 255, 255, 0.06);
        --color-shadow-soft: rgba(0, 0, 0, 0.4);
      }

      /* Tailwind preflight-equivalent resets (prevent raw browser bullets/spacing) */
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv01', 'ss03'; }
      ul, ol, menu { list-style: none; margin: 0; padding: 0; }
      img, svg, video, canvas { display: block; max-width: 100%; }
      h1, h2, h3, h4, h5, h6, p { margin: 0; }
      a { color: inherit; text-decoration: inherit; }
      button, input, select, textarea { font: inherit; color: inherit; }

      /* Background color to prevent white flash in dark mode */
      body { background-color: var(--color-bg-primary); color: var(--color-text-primary); }
    </style>
    <!-- data-cfasync="false" prevents Cloudflare Rocket Loader / Auto Minify
         from rewriting this <link> to media="print" with an onload flipback.
         Vite already minifies in production, so CF optimization is redundant
         and has caused intermittent total style loss (see AUDIT_DASHBOARD_SHELL Finding 1). -->
    <link rel="stylesheet" href="/index.css" data-cfasync="false" />
    <script>
      // Cloudflare CSS optimization safety:
      // If any stylesheet is rewritten to media="print" and onload is stripped,
      // force media back to "all" so runtime styles always apply.
      (function () {
        function normalizeStylesheetMedia(node) {
          if (!node || node.tagName !== 'LINK') return;
          if (node.rel !== 'stylesheet') return;
          if (!node.href) return;
          // Scope to the app's own stylesheets only (not third-party fonts etc.)
          // so that other stylesheets can be managed by services/initialLoadOptimizer.ts
          // without fighting over media="print".
          // In dev: /index.css  |  In production: /assets/index-HASH.css
          var href = node.href;
          var isAppCSS = /\/index[^/]*\.css(\?|$)/.test(href) ||
                         /\/assets\/(?:index|component)-[^/]*\.css(\?|$)/.test(href);
          if (!isAppCSS) return;
          if (node.media === 'print') {
            node.media = 'all';
          }
        }

        function scanExistingStylesheets() {
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          for (var i = 0; i < links.length; i++) {
            normalizeStylesheetMedia(links[i]);
          }
        }

        // Run immediately for already-present links
        scanExistingStylesheets();

        // Observe head for late-injected or rewritten stylesheet links
        var observer = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var mutation = mutations[i];
            if (mutation.type === 'attributes') {
              normalizeStylesheetMedia(mutation.target);
            }

            for (var j = 0; j < mutation.addedNodes.length; j++) {
              var node = mutation.addedNodes[j];
              if (node.nodeType !== 1) continue;
              normalizeStylesheetMedia(node);
              if (node.querySelectorAll) {
                var nested = node.querySelectorAll('link[rel="stylesheet"]');
                for (var k = 0; k < nested.length; k++) {
                  normalizeStylesheetMedia(nested[k]);
                }
              }
            }
          }
        });

        observer.observe(document.head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['media', 'rel'],
        });

        // Final fallback once page load settles
        window.addEventListener('load', scanExistingStylesheets, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
