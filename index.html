<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Safety net for CJS/ESM mixed module initialization -->
    <script>
      var global = global || window;
      var exports = exports || {};
    </script>
    <link rel="icon" type="image/svg+xml" href="/Favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANaCEa</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="PANCE preparation platform with comprehensive medical database, performance tracking, clinical image training, and 15+ training modes for PA students."
    />
    <meta
      name="keywords"
      content="PANCE, Physician Assistant, PA exam, medical education, NCCPA, exam preparation, spaced repetition, clinical training"
    />
    <meta name="author" content="PANaCEa" />
    <meta name="theme-color" content="#1F283A" id="meta-theme-color" />

    <!-- Apply theme before first paint to prevent FOUC and match saved/system preference -->
    <script>
      (function () {
        var stored = localStorage.getItem('pance-ai-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        else root.classList.remove('dark');
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', dark ? '#101729' : '#e9ecf1');
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studypanacea.com/" />
    <meta property="og:title" content="PANaCEa" />
    <meta
      property="og:description"
      content="Study platform with comprehensive medical database, performance tracking, clinical training modes, and 1000+ conditions for PA students."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://studypanacea.com/" />
    <meta name="twitter:title" content="PANaCEa" />
    <meta
      name="twitter:description"
      content="Study platform with comprehensive medical database, performance tracking, clinical training modes, and 1000+ conditions for PA students."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PANaCEa" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to font CDNs and Clerk auth CDN to reduce RTT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://clerk.com" />
    <link rel="preconnect" href="https://clerk.com" crossorigin />
    <link rel="dns-prefetch" href="https://img.clerk.com" />

    <!-- Preload brand logo (LCP candidate on landing page) -->
    <link rel="preload" as="image" href="/Favicon.svg" />

    <!--
      Google Fonts: load asynchronously via JS-inserted <link> to eliminate
      render-blocking without an inline event handler (which fires a
      CSP-Report-Only violation when sha256 hashes are present in script-src).
      Dynamically-inserted stylesheet <link>s are non-blocking in all modern
      browsers. The <noscript> fallback handles JS-disabled environments.
    -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=Teko:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Guard CommonJS globals before any modulepreload/import execution.
      if (typeof globalThis.exports === 'undefined') {
        globalThis.exports = {};
      }
      if (typeof globalThis.module === 'undefined') {
        globalThis.module = { exports: globalThis.exports };
      }
      // Load Google Fonts without a render-blocking <link> or an inline
      // event handler (inline handlers trigger CSP-Report-Only violations
      // when sha256 hashes are present in script-src, because hashes
      // suppress unsafe-inline per the CSP Level 3 spec).
      // Dynamically-inserted <link rel="stylesheet"> elements are
      // non-blocking in all modern browsers — identical perf benefit.
      (function () {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href =
          'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700' +
          '&family=Poppins:wght@700&family=Teko:wght@400;500;600;700&display=swap';
        document.head.appendChild(l);
      })();
    </script>
    <style>
      :root {
        --header-height: 4rem;
        --nav-rail-width: 56px;
      }

      body {
        margin: 0;
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
    <script>
      // Cloudflare CSS optimization safety:
      // If any stylesheet is rewritten to media="print" and onload is stripped,
      // force media back to "all" so runtime styles always apply.
      (function () {
        function normalizeStylesheetMedia(node) {
          if (!node || node.tagName !== 'LINK') return;
          if (node.rel !== 'stylesheet') return;
          if (!node.href) return;
          // Scope this guard to the primary app stylesheet only so that
          // other stylesheets can be managed by services/initialLoadOptimizer.ts
          // without fighting over media="print".
          var href = node.href;
          if (!/\/index\.css(\?|$)/.test(href)) return;
          if (node.media === 'print') {
            node.media = 'all';
          }
        }

        function scanExistingStylesheets() {
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          for (var i = 0; i < links.length; i++) {
            normalizeStylesheetMedia(links[i]);
          }
        }

        // Run immediately for already-present links
        scanExistingStylesheets();

        // Observe head for late-injected or rewritten stylesheet links
        var observer = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var mutation = mutations[i];
            if (mutation.type === 'attributes') {
              normalizeStylesheetMedia(mutation.target);
            }

            for (var j = 0; j < mutation.addedNodes.length; j++) {
              var node = mutation.addedNodes[j];
              if (node.nodeType !== 1) continue;
              normalizeStylesheetMedia(node);
              if (node.querySelectorAll) {
                var nested = node.querySelectorAll('link[rel="stylesheet"]');
                for (var k = 0; k < nested.length; k++) {
                  normalizeStylesheetMedia(nested[k]);
                }
              }
            }
          }
        });

        observer.observe(document.head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['media', 'rel'],
        });

        // Final fallback once page load settles
        window.addEventListener('load', scanExistingStylesheets, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
