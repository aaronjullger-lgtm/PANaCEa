name = "panacea"
compatibility_date = "2025-12-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# KV namespace for distributed rate limiting and caching
# Create with: npx wrangler kv:namespace create RATE_LIMIT_KV
# Create with: npx wrangler kv:namespace create CACHE

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "7df124d8b81f400eafe6ba55477bf11d"

# Content cache (Sprint 5: PANACEA_CACHE) - bound as CACHE for Pages Functions
[[kv_namespaces]]
binding = "CACHE"
id = "b576c43270a3407a8e5ae65afad0fe7e"

# Note: Scheduled cache warming via cron triggers is not supported for Cloudflare Pages.
# Use an external scheduler (e.g., GitHub Actions, cron-job.org) to call /api/admin/cache/warm periodically.

# Note: [build] section is NOT supported in wrangler.toml for Pages projects.
# Build command is configured in Cloudflare Pages dashboard or via CI.
# Node version is set via .node-version file (22) at repo root.

[vars]
NODE_VERSION = "22"
ENVIRONMENT = "production"
