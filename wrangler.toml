# Preview/private-beta staging must not share production state.
# Do not commit placeholder KV IDs: Wrangler validates every environment block
# during production deploy and rejects fake namespace IDs. After creating preview
# namespaces, add [[env.preview.kv_namespaces]] entries with the real hex IDs:
#   npx wrangler kv:namespace create RATE_LIMIT_KV --preview
#   npx wrangler kv:namespace create CACHE --preview
[env.preview]

