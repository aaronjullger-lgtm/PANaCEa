# CRITICAL: Add these secrets via Cloudflare Dashboard
# Cloudflare Dashboard > Workers & Pages > [your project] > Settings > Environment Variables
# Set variables for BOTH "Production" and "Preview" (or at least Production for main branch).
# Required Variables:
# - CLERK_SECRET_KEY: sk_live_... (your actual Clerk secret key)
# - DATABASE_URL: prisma+postgres://accelerate.prisma-data.net/?api_key=... (Prisma Accelerate URL)
# - GEMINI_API_KEY: AIzaSy... (Google Gemini API key)
# - SUPABASE_SERVICE_ROLE_KEY: eyJ... (Supabase service role key)
# Note: Secret keys should NEVER be committed to version control

# OSCE Durable Objects are intentionally not bound for the private beta Pages
# deploy. Pages can consume an existing Durable Object Worker, but it cannot
# deploy that Worker from this project. Re-enable only after the OSCE Worker is
# deployed separately and the route is part of the launch surface.
