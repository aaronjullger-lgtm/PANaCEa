# PANaCEa Local Development Docker Setup
#
# This docker-compose provides a local PostgreSQL database for development
# when you don't have access to the production Supabase/Prisma Accelerate.
#
# Usage:
#   docker-compose up -d          # Start PostgreSQL in background
#   docker-compose logs -f db     # View database logs
#   docker-compose down           # Stop and remove containers
#   docker-compose down -v        # Stop and remove containers + volumes (DELETES DATA)
#
# After starting, update .env:
#   DATABASE_URL="postgresql://panacea:panacea_dev@localhost:5432/panacea_dev"
#
# Then run migrations:
#   npm run db:migrate:dev
#
# NOTE: For production, use Prisma Accelerate with Supabase.
# This is for LOCAL DEVELOPMENT ONLY.

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: panacea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panacea
      POSTGRES_PASSWORD: panacea_dev
      POSTGRES_DB: panacea_dev
    ports:
      - '5432:5432'
    volumes:
      - panacea_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U panacea -d panacea_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: panacea-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@panacea.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - panacea_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools # Only start with: docker-compose --profile tools up

  # Development server (optional - use when you want containerized dev)
  # Uncomment to run the full stack in Docker
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   container_name: panacea-app
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: "postgresql://panacea:panacea_dev@db:5432/panacea_dev"
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
  #     - "3001:3001"
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   command: npm run dev:all

volumes:
  panacea_postgres_data:
    driver: local
  panacea_pgadmin_data:
    driver: local

# Network for service communication
networks:
  default:
    name: panacea-network
